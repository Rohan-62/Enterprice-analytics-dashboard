<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Suppliers - Analytical Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <script src="../../assets/js/api.js"></script>
</head>

<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="../index.html" class="logo">
                <span class="logo-text">Analytical Dashboard</span>
            </a>
            <div class="nav-links">
                <a href="../index.html" class="nav-link">Home</a>
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="products.html" class="nav-link">Products</a>
                <a href="suppliers.html" class="nav-link active">Suppliers</a>
                <a href="#" class="nav-link" onclick="logout()">Logout</a>
            </div>
        </div>
    </nav>
    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1 class="page-title">Manage Suppliers</h1>
                <p class="page-subtitle">Add, edit, or delete suppliers</p>
            </div>

            <!-- Add Supplier Form -->
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Add New Supplier</h3>
                </div>
                <form id="addSupplierForm" class="flex" style="gap: 16px; flex-wrap: wrap;">
                    <input type="text" class="form-control" id="newSupplierName" placeholder="Supplier name" required
                        style="flex: 1; min-width: 200px;">
                    <input type="text" class="form-control" id="newSupplierLocation" placeholder="Location" required
                        style="flex: 1; min-width: 200px;">
                    <button type="submit" class="btn btn-primary">Add Supplier</button>
                </form>
            </div>

            <!-- Suppliers Table -->
            <div class="card mt-4">
                <div class="card-header">
                    <h3 class="card-title">All Suppliers</h3>
                </div>
                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Location</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="suppliersTableBody">
                            <tr>
                                <td colspan="4" class="text-center">Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <!-- Pagination Controls -->
                <div class="pagination-controls"
                    style="display: flex; justify-content: center; gap: 10px; margin-top: 20px; align-items: center; padding-bottom: 20px;">
                    <button id="prevPage" class="btn btn-secondary btn-sm" onclick="changePage(-1)">Previous</button>
                    <span id="pageInfo" style="font-weight: 500;">Page 1 of 1</span>
                    <button id="nextPage" class="btn btn-secondary btn-sm" onclick="changePage(1)">Next</button>
                </div>
            </div>

            <!-- Edit Modal -->
            <div class="modal-overlay" id="editSupplierModal">
                <div class="modal">
                    <div class="modal-header">
                        <h3>Edit Supplier</h3>
                        <button class="modal-close" onclick="closeModal('editSupplierModal')">&times;</button>
                    </div>
                    <form id="editSupplierForm">
                        <input type="hidden" id="editSupplierId">

                        <div class="form-group">
                            <label for="editSupplierName">Supplier Name</label>
                            <input type="text" class="form-control" id="editSupplierName" required>
                        </div>

                        <div class="form-group">
                            <label for="editSupplierLocation">Location</label>
                            <input type="text" class="form-control" id="editSupplierLocation" required>
                        </div>

                        <button type="submit" class="btn btn-primary btn-block">Save Changes</button>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Analytical Dashboard. All rights reserved.</p>
        </div>
    </footer>
    <script>
        // Check authentication
        if (!sessionStorage.getItem('admin_logged_in')) {
            window.location.href = 'login.html';
        }

        let allSuppliers = [];
        let currentPage = 1;
        const itemsPerPage = 20;

        document.addEventListener('DOMContentLoaded', async () => {
            await loadSuppliers();
            setupForms();
        });

        async function loadSuppliers() {
            try {
                allSuppliers = await window.api.getSuppliers();
                currentPage = 1;
                renderTable();
            } catch (error) {
                document.getElementById('suppliersTableBody').innerHTML = '<tr><td colspan="4" class="text-center text-danger">Error loading suppliers</td></tr>';
            }
        }

        function renderTable() {
            const tbody = document.getElementById('suppliersTableBody');

            if (allSuppliers.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center">No suppliers found</td></tr>';
                updatePagination();
                return;
            }

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const displayedSuppliers = allSuppliers.slice(startIndex, endIndex);

            tbody.innerHTML = displayedSuppliers.map(s => `
                <tr>
                    <td>${s.id}</td>
                    <td>${escapeHtml(s.name)}</td>
                    <td>${escapeHtml(s.location)}</td>
                    <td>
                        <button class="btn btn-secondary btn-sm" onclick="editSupplier(${s.id}, '${escapeJs(s.name)}', '${escapeJs(s.location)}')">Edit</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteSupplier(${s.id})">Delete</button>
                    </td>
                </tr>
            `).join('');

            updatePagination();
        }

        function updatePagination() {
            const totalPages = Math.ceil(allSuppliers.length / itemsPerPage) || 1;
            document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('prevPage').disabled = currentPage === 1;
            document.getElementById('nextPage').disabled = currentPage === totalPages;
        }

        function changePage(direction) {
            const totalPages = Math.ceil(allSuppliers.length / itemsPerPage) || 1;
            const newPage = currentPage + direction;
            if (newPage >= 1 && newPage <= totalPages) {
                currentPage = newPage;
                renderTable();
            }
        }

        function setupForms() {
            // Add supplier form
            document.getElementById('addSupplierForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = document.getElementById('newSupplierName').value.trim();
                const location = document.getElementById('newSupplierLocation').value.trim();

                if (!name || !location) return;

                try {
                    const result = await window.api.addSupplier(name, location);
                    if (result.success) {
                        document.getElementById('newSupplierName').value = '';
                        document.getElementById('newSupplierLocation').value = '';
                        await loadSuppliers();
                    } else {
                        alert('Error: ' + result.message);
                    }
                } catch (error) {
                    alert('Error adding supplier');
                }
            });

            // Edit supplier form
            document.getElementById('editSupplierForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const id = parseInt(document.getElementById('editSupplierId').value);
                const name = document.getElementById('editSupplierName').value.trim();
                const location = document.getElementById('editSupplierLocation').value.trim();

                if (!name || !location) return;

                try {
                    const result = await window.api.updateSupplier(id, name, location);
                    if (result.success) {
                        closeModal('editSupplierModal');
                        await loadSuppliers();
                    } else {
                        alert('Error: ' + result.message);
                    }
                } catch (error) {
                    alert('Error updating supplier');
                }
            });
        }

        function editSupplier(id, name, location) {
            document.getElementById('editSupplierId').value = id;
            document.getElementById('editSupplierName').value = name;
            document.getElementById('editSupplierLocation').value = location;
            openModal('editSupplierModal');
        }

        async function deleteSupplier(id) {
            if (!confirm('Are you sure you want to delete this supplier? This will also delete all associated price entries.')) return;

            try {
                const result = await window.api.deleteSupplier(id);
                if (result.success) {
                    await loadSuppliers();
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (error) {
                alert('Error deleting supplier');
            }
        }

        function logout() {
            sessionStorage.removeItem('admin_logged_in');
            sessionStorage.removeItem('admin_user');
            window.location.href = 'login.html';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function escapeJs(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '\\"');
        }

        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }
    </script>
</body>

</html>
